<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnostic HydraSpec Pro</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1e1e1e;
            color: #e0e0e0;
        }
        .test {
            padding: 10px;
            margin: 5px 0;
            border-radius: 4px;
        }
        .pass {
            background: #2d5016;
            border-left: 4px solid #4CAF50;
        }
        .fail {
            background: #5c1616;
            border-left: 4px solid #f44336;
        }
        .pending {
            background: #4a4a1a;
            border-left: 4px solid #FFD700;
        }
        h1 { color: #2196F3; }
        pre {
            background: #2c2c2c;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>🔧 Diagnostic HydraSpec Pro V 02/02/2026</h1>
    <div id="results"></div>

    <!-- Charger les scripts dans le bon ordre -->
    <script src="constants.js"></script>
    <script src="fft.js"></script>

    <script>
        const results = document.getElementById('results');

        function test(name, fn) {
            const div = document.createElement('div');
            div.className = 'test pending';
            div.textContent = `⏳ ${name}...`;
            results.appendChild(div);

            try {
                const result = fn();
                if (result) {
                    div.className = 'test pass';
                    div.innerHTML = `✅ ${name}<br><pre>${result}</pre>`;
                } else {
                    div.className = 'test fail';
                    div.textContent = `❌ ${name} - Test échoué`;
                }
            } catch (error) {
                div.className = 'test fail';
                div.innerHTML = `❌ ${name}<br><pre>Erreur: ${error.message}\n${error.stack}</pre>`;
            }
        }

        // Tests
        test('1. Constantes chargées', () => {
            if (typeof APP_VERSION !== 'undefined' &&
                typeof MAX_DISPLAY_POINTS !== 'undefined' &&
                typeof HALO_BASE_SIZE !== 'undefined') {
                return `APP_VERSION: ${APP_VERSION}\nMAX_DISPLAY_POINTS: ${MAX_DISPLAY_POINTS}\nHALO_BASE_SIZE: ${HALO_BASE_SIZE}`;
            }
            return false;
        });

        test('2. Module FFT chargé', () => {
            if (typeof computeFFT === 'function' &&
                typeof applyWindow === 'function' &&
                typeof fftCache !== 'undefined') {
                return `computeFFT: OK\napplyWindow: OK\nfftCache: ${fftCache.constructor.name}`;
            }
            return false;
        });

        test('3. FFT computation test', () => {
            const signal = new Float32Array([1, 2, 3, 4, 5, 6, 7, 8]);
            const result = computeFFT(signal);
            if (result && result.re && result.im) {
                return `FFT calculée avec succès\nre.length: ${result.re.length}\nim.length: ${result.im.length}`;
            }
            return false;
        });

        test('4. applyWindow test', () => {
            const signal = new Float32Array([1, 2, 3, 4]);
            const windowed = applyWindow(signal, 'hanning');
            if (windowed && windowed.length === 4) {
                return `Fenêtre appliquée avec succès\nOriginal: [${Array.from(signal).join(', ')}]\nFenêtrée: [${Array.from(windowed).map(v => v.toFixed(2)).join(', ')}]`;
            }
            return false;
        });

        test('5. FFTCache test', () => {
            const key = fftCache.generateKey(100, 4096, 'hanning', 0.5);
            fftCache.set(key, { test: 'data' });
            const retrieved = fftCache.get(key);
            if (retrieved && retrieved.test === 'data') {
                return `Cache fonctionne correctement\nClé: ${key}\nDonnées récupérées: ${JSON.stringify(retrieved)}`;
            }
            return false;
        });

        // Test du DOM
        setTimeout(() => {
            test('6. Vérification index.html', () => {
                return fetch('index.html')
                    .then(response => response.text())
                    .then(html => {
                        const checks = [
                            { name: 'toggleFFTParams', test: html.includes('toggleFFTParams()') },
                            { name: 'fft-params-header', test: html.includes('id="fft-params-header"') },
                            { name: 'fft-params-content', test: html.includes('id="fft-params-content"') },
                            { name: 'res-peak', test: html.includes('id="res-peak"') },
                            { name: 'constants.js chargé', test: html.includes('src="constants.js"') },
                            { name: 'fft.js chargé', test: html.includes('src="fft.js"') }
                        ];

                        const summary = checks.map(c =>
                            `${c.test ? '✓' : '✗'} ${c.name}`
                        ).join('\n');

                        return checks.every(c => c.test) ? summary : false;
                    });
            });
        }, 100);
    </script>
</body>
</html>
